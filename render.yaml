services:
  # ----------------------------------------------------
  # 1. KalaSetu FastAPI Backend Service
  # ----------------------------------------------------
  - type: web
    name: kalasetu-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PROJECT_NAME
        value: KalaSetu
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173,https://*.vercel.app,https://*.onrender.com"

  # ----------------------------------------------------
  # 2. KalaSetu React Vite Frontend Static Site
  # ----------------------------------------------------
  - type: web
    name: kalasetu-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: kalasetu-backend
          property: host
